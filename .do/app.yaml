# DigitalOcean App Platform spec for UAE Driver Jobs.
#
# This file is a template: update `repo` below to match your GitHub repo, then either
# `doctl apps create --spec .do/app.yaml` or import it in the DO console (Create App -> Edit
# Your App Spec). See docs/DEPLOYMENT.md for the full walkthrough, including which secret
# values to fill in via the App Platform UI (never commit real secrets to this file).
name: uae-driver-jobs
region: fra

databases:
  - name: uae-driver-jobs-db
    engine: PG
    version: "16"
    production: false # set true for a production-grade managed cluster instead of a dev DB

services:
  - name: web
    github:
      repo: ahmedabuseif1997/uaedriverjob
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 10
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${uae-driver-jobs-db.DATABASE_URL}
      - key: NEXT_PUBLIC_BASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_PUBLISHABLE_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_PRICE_JOB_STANDARD
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_PRICE_JOB_FEATURED
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_PRICE_JOB_URGENT
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_PRICE_SUB_BASIC
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_PRICE_SUB_PRO
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_PRICE_SUB_ENTERPRISE
        scope: RUN_TIME
        type: SECRET
      - key: DO_SPACES_ENDPOINT
        scope: RUN_TIME
        type: SECRET
      - key: DO_SPACES_REGION
        scope: RUN_TIME
        type: SECRET
      - key: DO_SPACES_BUCKET
        scope: RUN_TIME
        type: SECRET
      - key: DO_SPACES_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DO_SPACES_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: DO_SPACES_CDN_URL
        scope: RUN_TIME
        type: SECRET

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: ahmedabuseif1997/uaedriverjob
      branch: main
    environment_slug: node-js
    build_command: npm ci
    run_command: npm run db:deploy
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${uae-driver-jobs-db.DATABASE_URL}
