services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uaedriverjob
      POSTGRES_PASSWORD: uaedriverjob
      POSTGRES_DB: uaedriverjob
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uaedriverjob"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
